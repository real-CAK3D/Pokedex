<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Player</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #game { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="game"></div>
  <script>
    // Hosts EmulatorJS inside the Pokédex screen. The parent app sends:
    //   {type:'boot', rom:File, system, name, save?:Uint8Array, touch:boolean}
    //   {type:'input', index, value}   (RetroArch joypad ids)
    //   {type:'flush'}                 (ask for the current battery save)
    // and receives {type:'started'} and {type:'save', data}.
    const ORIGIN = location.origin;
    const post = msg => parent.postMessage(msg, ORIGIN);
    let lastSaveSig = '';

    // debug: forward errors and EmulatorJS's loading status to the app's log
    const plog = msg => post({ type: 'log', msg: String(msg).slice(0, 1000) });
    window.addEventListener('error', e => plog(`error: ${e.message} @ ${e.filename}:${e.lineno}`));
    window.addEventListener('unhandledrejection', e => plog(`unhandled: ${e.reason?.message || e.reason}`));
    const origErr = console.error.bind(console);
    console.error = (...a) => { plog('console.error: ' + a.map(x => x?.message || String(x)).join(' ')); origErr(...a); };
    let lastStatus = '';
    setInterval(() => {
      const t = document.querySelector('.ejs_loading_text, .ejs_start_button')?.textContent?.trim();
      if (t && t !== lastStatus) { lastStatus = t; plog(`status: ${t}`); }
    }, 1000);

    function sig(u8) {
      let h = u8.length;
      for (let i = 0; i < u8.length; i += 7) h = (h * 31 + u8[i]) | 0;
      return String(h);
    }

    function flush() {
      const gm = window.EJS_emulator?.gameManager;
      if (!gm) return;
      let data = null;
      try { data = gm.getSaveFile(); } catch (e) { /* no battery save for this game */ }
      if (!data || !data.length) return;
      const s = sig(data);
      if (s === lastSaveSig) return;
      lastSaveSig = s;
      post({ type: 'save', data: new Uint8Array(data) });
    }

    window.addEventListener('message', e => {
      if (e.origin !== ORIGIN) return;
      const m = e.data || {};
      if (m.type === 'boot') boot(m);
      else if (m.type === 'input') window.EJS_emulator?.gameManager?.simulateInput(0, m.index, m.value);
      else if (m.type === 'flush') flush();
    });

    function boot(m) {
      const core = m.system === 'gbc' ? 'gb' : m.system;
      window.EJS_player = '#game';
      window.EJS_core = core;
      window.EJS_gameName = m.name;
      window.EJS_gameUrl = m.rom;
      window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
      window.EJS_color = '#d7263d';
      window.EJS_startOnLoaded = true;
      window.EJS_backgroundColor = '#000';
      window.EJS_defaultOptions = { 'virtual-gamepad': m.touch ? 'enabled' : 'disabled', 'save-state-location': 'browser' };
      window.EJS_Buttons = {
        playPause: false, restart: true, mute: true, settings: true, fullscreen: true,
        saveState: true, loadState: true, screenRecord: false, gamepad: false, cheat: false,
        volume: true, saveSavFiles: true, loadSavFiles: true, quickSave: false, quickLoad: false,
        screenshot: false, cacheManager: false, exitEmulation: false, netplay: false, contextMenu: false,
      };
      window.EJS_onGameStart = () => {
        const gm = window.EJS_emulator.gameManager;
        if (m.save && m.save.length) {
          try {
            gm.FS.writeFile(gm.getSaveFilePath(), m.save);
            gm.loadSaveFiles();
            lastSaveSig = sig(m.save);
          } catch (e) { console.warn('could not restore save', e); }
        }
        post({ type: 'started' });
        setInterval(flush, 10000);
      };
      plog(`boot: core=${core} rom=${m.rom?.name} ${m.rom?.size} bytes save=${m.save ? m.save.length : 0}`);
      const s = document.createElement('script');
      s.onload = () => plog('loader.js loaded');
      s.onerror = () => plog('loader.js FAILED to load (no internet / CDN blocked?)');
      s.src = window.EJS_pathtodata + 'loader.js';
      document.body.append(s);
    }

    document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });
    post({ type: 'ready' });
  </script>
</body>
</html>
